  <style>/* Ehrenhub design tokens. Every module uses this shared visual language. */
:root{--green:#173f32;--green-2:#285c47;--ink:#203b30;--muted:#637169;--paper:#f9faf6;--white:#fff;--line:#dde4dc;--sage:#e6eee2;--sand:#f4ecd8;--lavender:#eeebf6;--rose:#f7e9e2;--coral:#c78160;--radius:20px;--shadow:0 12px 36px #163c2c08;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:108px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body:has(dialog[open]){overflow:hidden}
button,input,select{font:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button{color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
a{color:inherit;text-decoration:none}
button{border:0;background:none}
button,select{touch-action:manipulation}
input,select{min-width:0}
img,svg{display:block;max-width:100%}
::selection{background:#ccdec2;color:var(--green)}
:focus-visible{outline:3px solid #50795f;outline-offset:5px;border-radius:5px}
input:focus-visible,select:focus-visible{outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-80px;left:20px;z-index:200;background:var(--green);color:white;padding:12px 20px;border-radius:8px}
.skip-link:focus{top:12px}
.icon{width:22px;height:22px;flex:0 0 auto}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3,h4{font-weight:650;line-height:1.13;letter-spacing:-.04em}
h1{font-size:clamp(42px,5vw,64px);margin-bottom:24px;letter-spacing:-.055em}
h2{font-size:34px;margin-bottom:18px}
h3{font-size:21px;margin-bottom:12px;letter-spacing:-.025em}
p{margin-bottom:16px}
.eyebrow{text-transform:uppercase;font-size:10.5px;font-weight:700;letter-spacing:.16em;line-height:1.5;color:var(--green-2);margin-bottom:15px}
.serif-word{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;letter-spacing:-.055em}
.sage{background:var(--sage)}.sand{background:var(--sand)}.lavender{background:var(--lavender)}.rose{background:var(--rose)}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:12px 20px;font-size:13px;font-weight:600;border-radius:9px;border:1px solid transparent;line-height:1.4;transition:background .2s,transform .2s,box-shadow .2s;text-align:center}
.button .icon{width:18px;height:18px}
.button.primary{background:var(--green);color:var(--white)}
.button.primary:hover:not(:disabled){background:#285b45;box-shadow:0 5px 15px #173f3218;transform:translateY(-1px)}
.button.secondary{background:var(--white);border-color:var(--line)}
.button.secondary:hover{border-color:#83988b;background:#f4f7f0}
.button.ghost{color:var(--muted);padding-inline:12px}
.button.ghost:hover{background:var(--sage);color:var(--green)}
.button.light{background:#f1f3e7;color:var(--green)}
.button.light:hover{background:white;transform:translateY(-2px)}
.full-width{width:100%}
.text-link{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:13px;line-height:1.5;padding:3px 0}
.text-link .icon{width:17px;height:17px;transition:transform .2s}
.text-link:hover{color:#508159}
.text-link:hover .icon{transform:translate(2px,-1px)}
.text-link.subtle{color:var(--muted);font-weight:400}
.icon-button{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;transition:background .2s}
.icon-button:hover,.icon-button.active{background:var(--sage)}
.badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:6px;font-size:10.5px;font-weight:600;line-height:1.4;letter-spacing:.01em}
.badge.outline{border:1px solid var(--line);background:transparent;color:var(--muted)}
.small-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.small-icon .icon{width:19px;height:19px}
.large-icon{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;margin-bottom:22px}
.large-icon .icon{width:28px;height:28px}
.notice{display:flex;align-items:flex-start;gap:12px;background:#f0f3ea;border:1px solid #e2e7dc;border-radius:10px;padding:17px 19px;color:#576559;margin:22px 0;font-size:12px;line-height:1.65}
.notice>.icon{width:18px;height:18px;margin-top:2px}
.notice p{margin:0}.notice strong{font-weight:600}
.compact-notice{padding:12px 16px;margin:18px 0 5px}
.quiet-note{font-size:11px;line-height:1.6;color:var(--muted);margin:16px 0 0}
.prototype-bar{padding:7px max(32px,calc((100% - 1260px)/2));background:var(--green);color:#d4e1d4;display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.015em;min-height:33px}
.prototype-bar>span{display:flex;align-items:center;gap:7px}

.prototype-bar button .icon{width:12px;height:12px}
.site-header{position:sticky;top:0;z-index:35;background:#f9faf6f5;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1324px;padding:0 32px;height:80px;margin:auto;display:flex;align-items:center;gap:45px}

.brand svg{width:34px;height:34px;margin-right:9px}
.brand-mark{display:block}.brand-dot{color:var(--coral)}
.desktop-nav{display:flex;align-items:center;justify-content:center;gap:7px;margin-left:auto}
.nav-link{white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);padding:9px 12px;border-radius:8px;display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.nav-link:hover{color:var(--green);background:#edf2e8}

.nav-link.sos-link{margin-left:4px;color:#835744}
.nav-link.sos-link .icon{width:17px;height:17px}
.nav-link.sos-link.active{background:var(--rose)}
.header-actions{display:flex;gap:5px;margin-left:12px;align-items:center}
.saved-nav .icon{width:19px;height:19px}
.bookmark-count{position:absolute;top:0;right:-1px;min-width:16px;height:16px;border-radius:50%;background:var(--green);color:white;font-size:9px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.bookmark-count.is-empty{display:none}
.mobile-menu-button{display:none}
.mobile-nav{padding:12px 24px 24px;background:var(--paper);border-top:1px solid var(--line)}
.mobile-nav a{display:flex;align-items:center;justify-content:space-between;padding:14px 8px;border-bottom:1px solid var(--line);font-size:15px}
.mobile-nav a[aria-current]{font-weight:700;color:var(--green)}
#main{max-width:1264px;padding:0 32px 70px;margin:0 auto;min-height:calc(100vh - 320px)}
#main:focus{outline:none}
.page-enter{animation:pageIn .38s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero{display:grid;grid-template-columns:1.08fr 1fr;gap:35px;align-items:center;padding:78px 0 64px;min-height:580px}
.hero-copy{position:relative;z-index:2}
.hero .eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;margin-bottom:24px}
.tiny-flower svg{width:17px;height:17px}
.hero h1{font-size:clamp(54px,5.45vw,74px);line-height:1.07;letter-spacing:-.065em;margin-bottom:27px;font-weight:650}
.underlined{position:relative;display:inline-block;z-index:0}
.underlined:after{content:"";position:absolute;left:3px;right:-2px;bottom:1px;height:11px;background:#d3dfb7;z-index:-1;border-radius:60% 30% 70% 20%;transform:rotate(-2deg)}
.hero-description{font-size:15px;line-height:1.8;max-width:437px;color:var(--muted);margin-bottom:30px}
.hero-search{display:flex;align-items:center;gap:13px;padding:9px 9px 9px 18px;background:white;border:1px solid #ccd8ca;border-radius:12px;max-width:500px;box-shadow:0 5px 15px #163c2c04;transition:border-color .2s,box-shadow .2s}
.hero-search:focus-within{border-color:var(--green-2);box-shadow:0 0 0 3px #e3ebdd}
.hero-search>.icon{width:21px;height:21px;color:#788776}
.hero-search input{border:0;outline:none!important;background:transparent;flex:1;min-width:0;width:100%;font-size:13px;color:var(--ink)}
.hero-search input::placeholder{color:#758174}
.hero-search button{display:grid;place-items:center;background:var(--green);color:white;width:42px;height:42px;border-radius:8px;flex:0 0 auto;transition:background .2s}
.hero-search button:hover{background:var(--green-2)}
.hero-search button .icon{width:20px;height:20px}
.popular-search{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-top:12px}
.popular-search>span{margin-right:3px}
.popular-search a{border:1px solid #dce4d6;padding:3px 9px;border-radius:20px;transition:background .2s}
.popular-search a:hover{background:var(--sage)}
.hero-location{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-top:25px;margin-bottom:0}
.hero-location .icon{width:13px;height:13px}
.hero-location>span{width:3px;height:3px;background:#a0ad9c;border-radius:50%;margin:0 3px}
.hero-art{position:relative;width:100%;height:420px;isolation:isolate;margin-top:10px;background-image:radial-gradient(#b8c7ad 1px,transparent 1px);background-size:18px 18px;background-position:center;background-repeat:repeat;border-radius:50%}
.art-orbit{position:absolute;border:1px solid #d6dfcd;border-radius:50%;z-index:-1}
.orbit-one{width:355px;height:355px;top:15px;left:70px;background:#edf2e7}
.orbit-two{width:425px;height:270px;top:75px;left:20px;transform:rotate(-25deg)}
.art-dot{position:absolute;border-radius:50%}.dot-one{width:15px;height:15px;top:40px;left:73px;background:#d6b28e}.dot-two{width:9px;height:9px;bottom:70px;right:28px;background:#769478}
.art-star{position:absolute;right:15px;top:55px;transform:rotate(9deg);color:#b77f5b}.art-star .icon{width:43px;height:43px;stroke-width:1.1}
.art-note{position:absolute;border-radius:13px;border:1px solid #cfdbc9;box-shadow:0 14px 25px #36503913;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.art-note:hover{box-shadow:0 22px 38px #36503920}
.note-back{background:#d6e2c6;width:224px;height:267px;left:24px;top:39px;transform:rotate(-10deg);padding:23px}
.note-back:hover{transform:rotate(-12deg) translate(-4px,-5px)}
.note-label{display:block;font-size:9px;letter-spacing:.08em;color:#59714b;font-weight:550}
.note-symbol{display:grid;place-items:center;width:60px;height:60px;margin:20px 0 18px;background:#c2d3ae;border-radius:18px}.note-symbol .icon{width:31px;height:31px;stroke-width:1.4}
.art-note strong{font-size:25px;font-weight:600;line-height:1.08;letter-spacing:-.04em;display:block}
.note-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #b5c5a6;margin-top:17px;padding-top:9px;font-size:8px}.note-foot .icon{width:14px;height:14px}
.note-front{background:#fffefa;width:232px;height:304px;left:197px;top:81px;transform:rotate(9deg);padding:20px;z-index:2}
.note-front:hover{transform:rotate(6deg) translateY(-6px)}
.note-header{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:-.4px;border-bottom:1px solid #e1e7da;padding-bottom:9px}
.mini-brand{display:flex;align-items:center;gap:4px}.mini-brand svg{width:17px;height:17px}
.note-header>.icon{width:13px;height:13px}
.note-illustration{height:96px;position:relative;margin:12px 0 14px;background:#f0f1e6;border-radius:8px;overflow:hidden}
.person{position:absolute;bottom:-5px;border-radius:35px 35px 5px 5px;width:54px;height:52px}
.person:before{content:"";position:absolute;top:-25px;left:14px;width:27px;height:31px;background:inherit;border-radius:45%;border:4px solid #f0f1e6}
.person-a{background:#9da876;left:14px;transform:rotate(-10deg);height:43px}
.person-b{background:#385c45;left:68px;z-index:2}
.person-c{background:#c38968;left:122px;transform:rotate(12deg);height:45px}
.drawing-spark{position:absolute;left:20px;top:9px;color:#c2b278;font-size:23px}.drawing-dots{position:absolute;right:14px;top:6px;letter-spacing:3px;font-size:12px;color:#7b9067}
.note-front>.note-label{font-size:8px;margin-bottom:7px}
.note-front strong{font-size:26px}
.note-check{display:flex;align-items:center;gap:5px;font-size:8px;margin-top:14px;color:#65725c}.note-check .icon{width:12px;height:12px}
.art-sticker{position:absolute;top:12px;left:218px;z-index:3;width:99px;height:99px;border-radius:50%;background:#e9ba99;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;transform:rotate(8deg);box-shadow:0 0 0 5px var(--paper);color:#593e2e}
.art-sticker .icon{width:20px;height:20px;stroke-width:1.5;margin-bottom:5px}.art-sticker span{font-size:10px;line-height:1.35;font-weight:650;letter-spacing:-.2px}
.art-caption{position:absolute;bottom:6px;left:15px;font-family:Georgia,serif;font-style:italic;font-size:14px;transform:rotate(-5deg);color:#6f7b62}.art-caption svg{position:absolute;width:69px;right:-68px;top:-25px}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}
.section-heading .eyebrow{margin-bottom:9px}.section-heading h2{margin:0;font-size:31px;line-height:1.16}
.section-hint{font-size:11px;color:var(--muted);padding-bottom:4px}.section-heading>.text-link{margin-bottom:4px;white-space:nowrap}
.start-section{padding:12px 0 68px}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.category-card{padding:24px 23px 18px;border:1px solid #173f3205;border-radius:16px;transition:transform .25s var(--ease),box-shadow .25s;display:flex;flex-direction:column;position:relative;overflow:hidden}
.category-card:hover{transform:translateY(-6px);box-shadow:0 12px 25px #163c2c0a}
.category-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:23px}.category-icon{display:block;transition:transform .3s var(--ease)}
.category-icon .icon{width:34px;height:34px;stroke-width:1.35}.category-card:hover .category-icon{transform:scale(1.16) rotate(-6deg)}
.category-number{font-size:10px;color:#647260;opacity:.8;font-weight:500}
.category-card h3{font-size:20px;letter-spacing:-.04em;margin-bottom:9px}.category-card p{font-size:12px;color:#5c6b5f;line-height:1.65;margin:0 0 24px;max-width:180px}
.category-card-bottom{margin-top:auto;padding-top:13px;border-top:1px solid #173f3214;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:9px;font-weight:500}.category-card-bottom .icon{width:18px;height:18px;transition:transform .25s}.category-card:hover .category-card-bottom .icon{transform:translate(2px,-2px)}
.good-start{display:grid;grid-template-columns:1.7fr 1fr;gap:28px;border-top:1px solid var(--line);padding:58px 0 60px}.good-start .section-heading{gap:10px}.good-start .section-heading h2{font-size:30px}.good-start .section-heading>.text-link{font-size:11px}
.featured-articles{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.article-card{position:relative;min-width:0;background:var(--white);border:1px solid var(--line);border-radius:15px;transition:transform .22s var(--ease),border-color .22s,box-shadow .22s;overflow:hidden}
.article-card:hover{border-color:#afc2a8;transform:translateY(-3px);box-shadow:var(--shadow)}
.article-card-link{padding:25px;display:flex;flex-direction:column;height:100%}
.card-kicker{display:flex;align-items:center;gap:10px;padding-right:18px;margin-bottom:30px;min-height:38px;font-size:9px;color:var(--muted)}
.card-kicker>span:not(.small-icon){max-width:140px;line-height:1.4}
.article-card h3{font-size:21px;font-weight:600;line-height:1.25;margin-bottom:13px;max-width:330px}
.article-card p{font-size:12px;color:var(--muted);line-height:1.75;margin:0 0 25px}
.card-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted)}
.card-bottom>span:first-child{display:flex;align-items:center;gap:5px;line-height:1.5}.card-bottom>span:first-child .icon{width:13px;height:13px}
.arrow-circle{border:1px solid var(--line);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:var(--green);flex-shrink:0;transition:background .2s}
.arrow-circle .icon{width:16px;height:16px}.article-card:hover .arrow-circle,.course-card:hover .arrow-circle{background:var(--sage);border-color:var(--sage)}
.bookmark-button{position:absolute;top:19px;right:17px;z-index:3;width:30px;height:32px;border-radius:8px;display:grid;place-items:center;color:#899488;transition:color .2s,background .2s}
.bookmark-button>.icon{width:17px;height:17px}.bookmark-button:hover{color:var(--green);background:#e6eee1}
.bookmark-button.is-saved{color:var(--green);background:#e6eee1}.bookmark-button.is-saved .icon,.bookmark-full.is-saved .icon{fill:currentColor;stroke-width:1.4}
.bookmark-full.is-saved{background:var(--sage);border-color:#ccd9c4}
.compact .article-card-link{padding:22px}.compact h3{font-size:19px}.compact .card-kicker{flex-direction:column;align-items:flex-start;gap:9px;margin-bottom:19px;padding-right:0}.compact .card-kicker>span:not(.small-icon){max-width:none}.compact p{font-size:11.5px;margin-bottom:18px}
.starter-card{position:relative;isolation:isolate;overflow:hidden;background:var(--green);color:#f0f3e8;padding:34px;border-radius:18px;display:flex;flex-direction:column}
.starter-symbol .icon{width:32px;height:32px;stroke-width:1.3;margin-bottom:25px;color:#c9d4af}
.starter-card .eyebrow{color:#b8c6a2;font-size:9px}.starter-card h2{font-size:34px;line-height:1.13;font-weight:500;letter-spacing:-.05em;max-width:280px}.starter-card p:not(.eyebrow){font-size:12px;line-height:1.8;color:#c3cfbf;max-width:250px;margin-bottom:30px}

.starter-doodle{position:absolute;width:170px;right:-65px;bottom:30px;z-index:-1;opacity:.13;transform:rotate(13deg)}
.training-preview{border-top:1px solid var(--line);padding:50px 0 55px}
.course-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:21px}
.course-card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:border-color .2s,transform .2s,box-shadow .2s;min-width:0}
.course-card:hover{transform:translateY(-4px);border-color:#b1c0a9;box-shadow:var(--shadow)}
.course-card>.bookmark-button{top:17px;right:15px;background:#ffffffb3;color:#5d705e}.course-card>.bookmark-button.is-saved{background:var(--green);color:white}

.course-card-top{height:116px;display:flex;align-items:center;padding:19px 22px;gap:16px;position:relative}

.course-top-label{display:flex;gap:6px;align-items:center;color:#60725d;font-size:9px;max-width:135px;padding-right:25px}.course-top-label .icon{width:16px;height:16px}

/* Schichtplan only: shared Ehrenhub tokens, no external assets or CSS framework. */
.sp-page{padding:48px 0 64px}
.sp-heading{display:flex;align-items:center;justify-content:space-between;gap:32px;margin-bottom:30px}
.sp-heading h1{font-size:clamp(38px,4.5vw,60px);margin-bottom:18px;line-height:1.04}
.sp-heading h1 span{color:var(--green-2);font-family:Georgia,serif;font-weight:400;font-style:italic}
.sp-heading>div>p:last-child{color:var(--muted);max-width:480px;margin-bottom:0;font-size:15px}
.sp-heading .eyebrow{display:flex;align-items:center;gap:9px}
.sp-hero-symbol{position:relative;width:154px;height:154px;display:grid;place-items:center;background:var(--sage);border-radius:40px;transform:rotate(-6deg);margin-right:30px;flex-shrink:0}
.sp-hero-symbol>.icon{width:78px;height:78px;stroke-width:1.1}
.sp-hero-symbol>span{position:absolute;right:-13px;bottom:-8px;border:5px solid var(--paper);width:52px;height:52px;display:grid;place-items:center;background:var(--green);color:white;border-radius:50%}
.sp-toolbar{display:flex;justify-content:space-between;gap:12px;margin:36px 0 26px;flex-wrap:wrap}
.sp-toolbar>div{display:flex;gap:9px;flex-wrap:wrap}
.sp-toolbar .button{font-size:12px;padding:9px 13px;min-height:40px}
.sp-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line);margin-bottom:30px;gap:12px}
.sp-steps button{display:flex;align-items:center;gap:10px;text-align:left;padding:14px 0 17px;border-bottom:3px solid transparent;font-size:12px;color:var(--muted)}
.sp-steps button>span{width:29px;height:29px;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--line);border-radius:50%;font-size:10px}
.sp-steps button .icon{width:15px;height:15px}
.sp-steps button.active{border-color:var(--green);color:var(--green)}
.sp-steps button.active>span{background:var(--green);border-color:var(--green);color:white}
.sp-steps button:hover{color:var(--green)}
.sp-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}
.sp-workspace{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:32px;min-width:0;box-shadow:var(--shadow)}
.sp-step-heading{margin-bottom:26px}
.sp-section-number{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--muted);display:block;margin-bottom:14px}
.sp-step-heading h2{font-size:34px;line-height:1.12;margin-bottom:13px;scroll-margin-top:160px}
.sp-step-heading p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:0;max-width:560px}
.sp-sidebar{position:sticky;top:112px}
.sp-overview{background:var(--sage);border:1px solid #dbe5d5;border-radius:19px;padding:25px}
.sp-overview-icon{width:44px;height:44px;display:grid;place-items:center;background:white;border-radius:12px;margin-bottom:25px}
.sp-overview .eyebrow{font-size:9px;margin-bottom:10px}
.sp-overview h2{font-size:26px;overflow-wrap:anywhere}
.sp-overview .sp-muted{font-size:12px}
.sp-overview dl{margin:25px 0 0}
.sp-overview dl>div{display:flex;align-items:baseline;gap:9px;justify-content:space-between;padding:11px 0;border-top:1px solid #cad7c5}
.sp-overview dt{font-size:12px;color:#4f6656}
.sp-overview dd{font-weight:700;margin:0;white-space:nowrap}
.sp-average{border-top:1px solid #cad7c5;margin:0;padding-top:18px;font-size:12px}
.sp-average strong{font-size:17px}
.sp-average small{font-size:11px;display:block;color:#4f6656;margin-top:8px;line-height:1.6}
.sp-local-note{display:flex;gap:10px;margin:20px 5px 0;font-size:12px}
.sp-local-note .icon{width:19px;height:19px;margin-top:2px}
.sp-local-note strong{font-weight:600}
.sp-local-note p{font-size:11px;color:var(--muted);margin:7px 0 0;line-height:1.7}
.sp-form{display:grid;gap:20px}
.sp-field{display:flex;flex-direction:column;gap:7px;text-align:left;min-width:0;font-size:12px;font-weight:600}
.sp-field small{font-size:11px;color:var(--muted);font-weight:400;line-height:1.6}
.sp-optional{font-weight:400;color:var(--muted);margin-left:7px}
.sp-page input:not([type=checkbox],[type=radio]),.sp-page textarea,.sp-page select{display:block;width:100%;border:1px solid #cfd9cf;background:#fff;color:var(--ink);border-radius:9px;font-family:inherit;font-size:14px;line-height:1.5;padding:11px 12px;min-height:46px;font-weight:400;max-width:100%}
.sp-page input::placeholder,.sp-page textarea::placeholder{color:#849088}
.sp-page textarea{resize:vertical;min-height:92px}
.sp-page input:focus-visible,.sp-page textarea:focus-visible,.sp-page select:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
.sp-page input[type=checkbox],.sp-page input[type=radio]{width:17px;height:17px;flex-shrink:0;accent-color:var(--green);margin:2px 0}
.sp-page select:disabled{background:#f3f6ef;opacity:1;color:var(--green-2)}
.sp-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sp-inline{display:flex;align-items:flex-end;gap:15px;flex-wrap:wrap}
.sp-inline>.sp-field{max-width:140px}
.sp-hint{display:flex;gap:12px;align-items:flex-start;background:#f4f6f0;padding:17px;border-radius:11px;font-size:12px;color:#526654}
.sp-hint .icon{width:18px;height:18px;margin-top:2px}
.sp-hint p{margin:0;line-height:1.7}
.sp-step-footer{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:29px;padding-top:24px;border-top:1px solid var(--line)}
.sp-step-footer>span{font-size:11px;color:var(--muted)}
.sp-muted{font-size:12px;line-height:1.7;color:var(--muted)}
.sp-add-area{background:#f7f9f4;padding:22px;border-radius:15px;border:1px solid var(--line)}
.sp-add-area>.button,.sp-people-add>.button{justify-self:start}
.sp-area-list{margin-top:24px;display:grid;gap:12px}
.sp-area{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sp-area summary{display:flex;align-items:center;gap:13px;cursor:pointer;padding:17px;list-style:none}
.sp-area summary::-webkit-details-marker{display:none}
.sp-area summary>span:nth-child(2){flex:1;min-width:0}
.sp-area summary strong{display:block;overflow-wrap:anywhere;font-size:15px}
.sp-area summary small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.sp-area summary>.icon{width:17px;height:17px;transition:transform .2s}
.sp-area[open] summary>.icon{transform:rotate(180deg)}
.sp-area[open] summary{border-bottom:1px solid var(--line);background:#fcfdfb}
.sp-area-dot{width:37px;height:37px;display:grid;place-items:center;flex-shrink:0;border-radius:10px}
.sp-area-dot .icon{width:19px;height:19px}
.sp-area-body{padding:18px}
.sp-area-tools{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px}
.sp-area-tools>.sp-field{flex:1}
.sp-area-tools>.button{font-size:11px;padding:11px 10px}
.sp-scroll{overflow-x:auto;margin:0 -3px;padding:0 3px 7px}
.sp-shifts-table{width:100%;border-collapse:collapse;font-size:12px;min-width:510px}
.sp-shifts-table th{color:var(--muted);font-size:10px;text-align:left;font-weight:600;padding:6px 4px}
.sp-shifts-table td{padding:6px 4px;border-bottom:1px solid #edf0e9}
.sp-shifts-table input:not([type=checkbox]){font-size:12px;min-height:40px;padding:8px 6px}
.sp-shifts-table td:nth-child(3){width:68px}
.sp-single-shift{margin-top:22px;display:grid;gap:14px}
.sp-small-title{font-size:12px;font-weight:650;margin:0}
.sp-empty-note{font-size:12px;color:var(--muted);text-align:center;padding:25px 10px;margin:0}
.sp-list-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 0 15px}
.sp-list-title h3{font-size:19px;margin:0}
.sp-list-title h3>span{display:inline-flex;align-items:center;justify-content:center;min-width:26px;padding:2px 7px;background:var(--sage);border-radius:6px;font-size:12px;margin-left:7px;vertical-align:middle}
.sp-people-list{display:grid;gap:9px}
.sp-person{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.sp-person.is-open{border-color:#9aaf9c}

/* Named pages keep wiki/article printing independent of the shift plan. */
@page ehrenhub-shift{size:A4 landscape;margin:0}
@media print{
  body[data-page=schichtplan]{margin:0;padding:0}
  body[data-page=schichtplan] #main{min-height:0;margin:0}
  body[data-page=schichtplan] .sp-page{padding:0}
  body[data-page=schichtplan] .sp-no-print,body[data-page=schichtplan] .sp-sidebar,body[data-page=schichtplan] .sp-screen-plan{display:none!important}
  body[data-page=schichtplan] .sp-layout{display:block}
  body[data-page=schichtplan] .sp-workspace{padding:0;border:0;border-radius:0;box-shadow:none}
  body[data-page=schichtplan] .sp-print-only{display:block;color:#111;font-family:Arial,sans-serif;font-size:9pt;line-height:normal}
  .sp-print-sheet{page:ehrenhub-shift;width:297mm;height:209.5mm;margin:0;padding:0;break-inside:avoid;break-after:page;page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .sp-print-sheet:last-child{break-after:auto;page-break-after:auto}
  .sp-print-sheet>svg{display:block;width:100%;height:100%;max-width:none;overflow:visible}
}

  <script>globalThis.EH = { Data: {"articles":[{"id":"erste-gruppenstunde","title":"Deine erste Gruppenstunde","summary":"Von der ersten Idee bis zur Abschlussrunde: ein einfacher Ablauf, der dir Sicherheit gibt.","category":"gruppenalltag","icon":"users","color":"lavender","minutes":5,"tags":["Gruppenstunde","Anfang","Spiele","Planen","Kennenlernen"],"featured":true,"intro":"Du brauchst keinen perfekten Plan. Ein klarer Rahmen, etwas Vorbereitung und Raum für die Ideen der Kinder sind ein guter Anfang.","sections":[{"title":"Erst die Gruppe, dann das Programm","text":"Wie alt sind die Kinder? Kennen sie sich schon? Wie viel Platz habt ihr? Stimmt eure Idee auf die Gruppe ab und plant Zeit für Ankommen und spontane Wünsche ein.","bullets":["Ein einfaches Ziel festlegen: etwa sich kennenlernen oder etwas gemeinsam gestalten.","Im Leitungsteam besprechen, wer Material, Begrüßung und Abschluss übernimmt.","Eine ruhige Alternative bereithalten, falls die Gruppe eine Pause braucht."]},{"title":"Ein Beispiel für 60 Minuten","text":"Die Zeiten sind ein Vorschlag. Orientiere dich an der Stimmung und den Bedürfnissen deiner Gruppe.","timeline":[["10 Min.","Ankommen & kurze Kennenlernrunde"],["10 Min.","Gemeinsam ein Bewegungsspiel auswählen"],["25 Min.","Eure Hauptaktion mit Raum zum Ausprobieren"],["10 Min.","Gemeinsam aufräumen & Feedback"],["5 Min.","Ausblick auf das nächste Treffen"]]},{"title":"Kurz vorher checken","text":"Diese kleine Liste kannst du direkt abhaken. Sie bleibt auf diesem Gerät gespeichert.","checklist":["Raum und Zugang sind geklärt","Material und Plan B liegen bereit","Aufgaben im Leitungsteam sind verteilt","Ansprechperson und wichtige Kontakte sind geklärt","Ein gemeinsamer Abschluss ist eingeplant"]},{"title":"Nach der Stunde ist vor der nächsten","text":"Nehmt euch als Team fünf Minuten: Was hat gut funktioniert? Wo hattet ihr Stress? Was wünschen sich die Kinder? Drei kurze Notizen reichen für den Anfang.","tip":"Lieber eine gute Aktion mit Zeit zum Mitmachen als fünf Programmpunkte im Schnelldurchlauf."}],"related":["teamaufgaben","feedbackrunde"]},{"id":"ehrenamt-start","title":"Neu im Ehrenamt? Hier fängst du an.","summary":"Finde eine Aufgabe, die zu dir passt – und die Menschen, die dich dabei unterstützen.","category":"einstieg","icon":"compass","color":"sage","minutes":4,"tags":["Einstieg","Anfang","Mitmachen","Orientierung"],"intro":"Du musst nicht alles können, bevor du mitmachst. Ein überschaubarer Einstieg hilft dir und deinem neuen Team.","sections":[{"title":"Überlege, was dir Freude macht","text":"Magst du organisieren, draußen sein oder kreativ mit einer Gruppe arbeiten? Überlege auch, wie viel Zeit du regelmäßig geben möchtest. Das ist ein guter Gesprächseinstieg."},{"title":"Lerne das Team kennen","text":"Frage nach einem Kennenlernen oder einer begleiteten Schnuppermöglichkeit. Klärt gemeinsam, welche Einführung und Qualifikation für deine Aufgabe erforderlich sind.","checklist":["Eine passende Gruppe gefunden","Erwartungen und zeitlichen Rahmen besprochen","Feste Ansprechperson kennengelernt","Nächsten kleinen Schritt vereinbart"]},{"title":"Klein anfangen ist völlig okay","text":"Vielleicht hilfst du zuerst bei einer einzelnen Aktion. Verantwortung darf wachsen. Hole dir Rückmeldung und sage frühzeitig, wenn dir etwas zu viel wird.","tip":"Ein fester Kontakt im Team macht den Einstieg oft leichter als eine lange Infomappe."}],"related":["juleica","teamaufgaben"]},{"id":"juleica","title":"Juleica: dein Weg zur Jugendleitung","summary":"Was du für deinen Einstieg klären solltest und wo du passende Ausbildungen findest.","category":"einstieg","icon":"graduation","color":"sage","minutes":4,"tags":["Juleica","Jugendleitercard","Ausbildung","Kurswoche","Jugendleitung"],"intro":"Du möchtest Verantwortung in der Jugendarbeit übernehmen? Nutze diese Beispielübersicht, um die nächsten Fragen mit deinem Verband zu klären.","sections":[{"title":"Deinen Ausbildungsweg finden","text":"Welche Grundausbildung passt zu deiner Aufgabe? Wer bietet sie in deiner Region an? Dein Verband hilft dir, den richtigen Kurs und die aktuell geltenden Voraussetzungen zu klären."},{"title":"Bausteine gemeinsam klären","text":"Frage gezielt nach den benötigten Nachweisen, ergänzenden Schulungen und dem Ablauf der Beantragung. Diese Demo nennt bewusst keine verbindlichen Stunden- oder Altersgrenzen.","checklist":["Grundausbildung mit dem Verband abgestimmt","Anforderungen an Erste Hilfe geprüft","Präventionsschulung und weitere Bausteine geklärt","Beantragung und zuständige Ansprechperson geklärt"]},{"title":"Von der Info zum passenden Kurs","text":"Im Fortbildungsfinder kannst du beispielhaft nach Gruppenleitung, Prävention und Erste Hilfe filtern. Verbindliche Informationen bekommst du direkt beim jeweiligen Anbieter.","action":{"label":"Fortbildungen entdecken","href":"#/fortbildungen?topic=leitung"}}],"source":"kjg","related":["ehrenamt-start","praevention-alltag"]},{"id":"teamaufgaben","title":"Aufgaben verteilen, ohne den Überblick zu verlieren","summary":"Eine einfache Teamrunde schafft Klarheit: Wer macht was – und bis wann?","category":"einstieg","icon":"layers","color":"sage","minutes":3,"tags":["Team","Organisation","Leitung","Aufgaben","Planung"],"sections":[{"title":"Alle Aufgaben sichtbar machen","text":"Sammelt zunächst gemeinsam, was ansteht. Auch unsichtbare Arbeit wie Nachfragen, Schlüssel holen oder Material zurückbringen gehört auf die Liste."},{"title":"Verantwortung klar vereinbaren","text":"Haltet pro Aufgabe eine zuständige Person und einen realistischen Zeitpunkt fest. Trennt die Verantwortung von den Menschen, die dabei helfen.","checklist":["Aufgaben vollständig gesammelt","Pro Aufgabe eine verantwortliche Person benannt","Zeitpunkt und nötige Unterstützung geklärt","Kurzen gemeinsamen Check-in vereinbart"]},{"title":"Platz für Rückfragen lassen","text":"Eine Aufgabe zurückzugeben ist besser, als still daran festzuhängen. Vereinbart, wie ihr rechtzeitig Bescheid sagt, wenn sich etwas ändert.","tip":"Fragt am Ende: Weiß jede Person, was ihr nächster Schritt ist?"}],"related":["erste-gruppenstunde","uebergabe"]},{"id":"freizeit-planen","title":"Die Freizeitplanung: vom Gedanken zum Plan","summary":"Die wichtigsten Fragen für eure nächste Fahrt – frühzeitig und gemeinsam sortiert.","category":"gruppenalltag","icon":"tent","color":"lavender","minutes":6,"tags":["Zeltlager","Freizeit","Fahrt","Planen","Camp","Budget"],"sections":[{"title":"Den Rahmen gemeinsam abstecken","text":"Bevor ihr ins Programm einsteigt: Für wen ist die Freizeit? Wann soll sie stattfinden? Welche Unterstützung braucht ihr? Sammelt offene Fragen und verteilt die Recherche."},{"title":"Die Grundlagen vorbereiten","text":"Diese Liste ist ein erster Organisationsimpuls, keine vollständige Sicherheits- oder Rechtscheckliste.","checklist":["Zeitraum und Zielgruppe vereinbart","Unterkunft und Anreise angefragt","Leitungsteam und Verantwortlichkeiten geklärt","Kostenplan und mögliche Förderung vorbereitet","Schutzkonzept, Zugänglichkeit und Notfallplanung mit dem Träger besprochen"]},{"title":"Förderung früh mitdenken","text":"Sammelt mögliche Förderwege schon während der Planung. Welche Fristen und Voraussetzungen gelten, müsst ihr beim zuständigen Träger prüfen.","action":{"label":"Antragsfinder öffnen","href":"#/antraege"}},{"title":"Wissen fürs nächste Mal behalten","text":"Sammelt nach der Freizeit, welche Abläufe euch geholfen haben und was ihr verändern möchtet. Eine kurze, gut sortierte Übergabe ist wertvoller als ein unkommentierter Ordner."}],"related":["foerderantrag-vorbereiten","uebergabe"]},{"id":"foerderantrag-vorbereiten","title":"Förderanträge entspannt vorbereiten","summary":"Bring eure Idee, die Zahlen und die offenen Fragen in eine klare Reihenfolge.","category":"finanzen","icon":"file","color":"sand","minutes":5,"tags":["Zuschuss","Zuschüsse","Förderung","Antrag","Geld","Finanzantrag","Budget"],"featured":true,"sections":[{"title":"Erst die passende Stelle finden","text":"Beschreibt euer Vorhaben in wenigen Sätzen. Klärt mit dem zuständigen Jugendring oder Verband, welche Förderung grundsätzlich infrage kommen könnte.","action":{"label":"Zum Antragsfinder","href":"#/antraege"}},{"title":"Die wichtigsten Angaben sammeln","text":"Welche Unterlagen tatsächlich nötig sind, steht in der jeweiligen Richtlinie. Die folgende Liste dient nur als Beispiel für eure Vorbereitung.","checklist":["Kurze Beschreibung und Ziel des Vorhabens","Zeitraum und geplanter Ort","Zielgruppe und erwartete Gruppengröße","Übersicht der geplanten Einnahmen und Ausgaben","Zuständigkeit, Fristen und erforderliche Nachweise geprüft"]},{"title":"Unklarheiten vor dem Absenden klären","text":"Bei offenen Fragen lohnt sich eine Rückfrage. Notiert, mit wem ihr gesprochen habt und welche Punkte ihr noch prüfen müsst. Die Entscheidung über Förderung trifft die zuständige Stelle.","tip":"Diese Demo berechnet keinen Förderanspruch. Maßgeblich sind die aktuellen Richtlinien des zuständigen Zuschussgebers."}],"source":"kjrStadt","related":["kostenplan","belege"]},{"id":"kostenplan","title":"Ein einfacher Kostenplan für eure Aktion","summary":"Ausgaben, Einnahmen und einen Puffer übersichtlich zusammentragen.","category":"finanzen","icon":"coins","color":"sand","minutes":4,"tags":["Kosten","Budget","Finanzen","Zuschuss","Kalkulation"],"sections":[{"title":"Die Ausgaben aufschreiben","text":"Sammelt erwartete Kosten für Material, Raum, Anreise und Verpflegung. Kennzeichnet, welche Zahlen schon feststehen und welche noch Schätzungen sind."},{"title":"Einnahmen danebenstellen","text":"Welche Beiträge oder Eigenmittel sind geplant? Welche Förderung ist bereits zugesagt? Führt unsichere Zuschüsse getrennt auf, damit ihr nicht mit unbestätigtem Geld plant.","checklist":["Ausgaben nach Bereichen gesammelt","Gesicherte Einnahmen erfasst","Noch offene Einnahmen klar markiert","Puffer und verbleibende Finanzierungslücke besprochen"]},{"title":"Den Plan aktuell halten","text":"Bestimmt eine Person, die Änderungen einträgt. Besprecht größere Abweichungen im Team, bevor weitere Ausgaben entstehen."}],"related":["foerderantrag-vorbereiten","belege"]},{"id":"belege","title":"Belege sammeln, die ihr später wiederfindet","summary":"Eine kleine Ablage spart euch bei der Abrechnung viel Sucherei.","category":"finanzen","icon":"file","color":"sand","minutes":3,"tags":["Abrechnung","Belege","Rechnung","Finanzen","Zuschuss"],"sections":[{"title":"Eine gemeinsame Struktur vereinbaren","text":"Ordnet Belege nach eurer Aktion und einem einheitlichen Schema. Zum Beispiel: Datum, Kostenbereich und kurze Beschreibung. Klärt vorher, wie der Träger Originale und digitale Kopien benötigt."},{"title":"Zeitnah statt alles am Ende","text":"Sammelt Belege direkt nach dem Einkauf. Haltet fest, wem eine Erstattung zusteht und wer den Vorgang prüft.","checklist":["Ablage und zuständige Person geklärt","Belege der passenden Aktion zugeordnet","Offene Erstattungen festgehalten","Vorgaben des Trägers zur Aufbewahrung geprüft"]},{"title":"Mit einer kurzen Übersicht übergeben","text":"Eine Tabelle mit Datum, Betrag, Zweck und Belegnummer kann die Übergabe erleichtern. Verbindliche Anforderungen erfragt ihr bei eurem Verband."}],"related":["kostenplan","foerderantrag-vorbereiten"]},{"id":"feedbackrunde","title":"Eine Feedbackrunde, bei der alle mitreden können","summary":"Drei einfache Fragen für einen guten gemeinsamen Abschluss.","category":"gruppenalltag","icon":"message","color":"lavender","minutes":3,"tags":["Feedback","Reflexion","Gruppenstunde","Methode","Runde"],"sections":[{"title":"Einen ruhigen Rahmen schaffen","text":"Plant die Runde als Teil eurer gemeinsamen Zeit ein. Erklärt, dass niemand etwas erzählen muss und unterschiedliche Meinungen willkommen sind."},{"title":"Drei Fragen reichen","text":"Gebt genug Zeit zum Überlegen. Antworten können gesprochen, aufgeschrieben oder durch ein Symbol gezeigt werden.","bullets":["Was hat dir heute Freude gemacht?","Was war schwierig oder hat dir gefehlt?","Was wünschst du dir beim nächsten Mal?"]},{"title":"Mit dem Feedback weiterarbeiten","text":"Fasst zusammen, was ihr gehört habt. Wählt gemeinsam eine konkrete Sache, die ihr beim nächsten Treffen ausprobieren möchtet.","tip":"Bedankt euch auch für kritische Rückmeldungen. Sie helfen euch, die Gruppe besser zu verstehen."}],"related":["erste-gruppenstunde","teamaufgaben"]},{"id":"praevention-alltag","title":"Prävention beginnt im Gruppenalltag","summary":"Wie ihr Grenzen, Mitsprache und Ansprechpersonen im Team zum Thema macht.","category":"schutz","icon":"shield","color":"rose","minutes":4,"tags":["PSG","Prävention","Schutz","Grenzen","Verhaltenskodex","Kinderschutz"],"sections":[{"title":"Den Schutzrahmen eures Trägers kennen","text":"Besprecht im Team, welches Schutzkonzept für eure Arbeit gilt und wo ihr Unterstützung bekommt. Dieser Beispielartikel ersetzt weder eine Schulung noch den geltenden Handlungsleitfaden."},{"title":"Mitsprache im Alltag ermöglichen","text":"Nehmt Wünsche und Grenzen ernst. Überlegt gemeinsam, wie Kinder und Jugendliche Kritik äußern und Unterstützung finden können, ohne sich vor der ganzen Gruppe erklären zu müssen."},{"title":"Ansprechpersonen sichtbar machen","text":"Kennt die zuständigen Fach- und Vertrauenspersonen eures Trägers. Bei Unsicherheit oder einer konkreten Sorge könnt ihr euch fachliche Beratung holen.","action":{"label":"Zu PSG & SOS","href":"#/sos"}},{"title":"Wissen gemeinsam vertiefen","text":"Nutzt passende Schulungen, um euch mit Prävention und euren Zuständigkeiten auseinanderzusetzen.","action":{"label":"Präventionskurse ansehen","href":"#/fortbildungen?topic=praevention"}}],"source":"bdkj","related":["verantwortung","juleica"]},{"id":"verantwortung","title":"Verantwortung übernehmen – Fragen vorher klären","summary":"Was ihr vor einer Aktion mit eurer Leitung und eurem Träger besprechen solltet.","category":"schutz","icon":"checkCircle","color":"rose","minutes":4,"tags":["Aufsicht","Verantwortung","Sicherheit","Planung","Schutz"],"sections":[{"title":"Die eigene Rolle verstehen","text":"Welche Aufgabe übernimmst du? Wer ist für die Gesamtleitung zuständig? Besprecht die Rollen vorab und klärt, wie ihr euch während der Aktion erreicht."},{"title":"Offene Fragen sichtbar machen","text":"Es ist sinnvoll, Fragen gemeinsam mit erfahrenen Verantwortlichen zu klären. Die folgenden Punkte sind Gesprächsanlässe und keine vollständige Auflistung rechtlicher Pflichten.","checklist":["Zuständigkeiten und Erreichbarkeit besprochen","Besonderheiten der Aktion geklärt","Einführung und nötige Schulungen abgestimmt","Schutz- und Notfallabläufe des Trägers kennengelernt"]},{"title":"Unterstützung einfordern dürfen","text":"Verantwortung heißt auch, eigene Grenzen zu kennen. Wenn dir eine Aufgabe ohne Unterstützung zu groß erscheint, sprich das an."}],"related":["praevention-alltag","freizeit-planen"]},{"id":"uebergabe","title":"Wissen weitergeben statt neu erfinden","summary":"So wird aus eurem privaten Sammelordner eine brauchbare Übergabe.","category":"einstieg","icon":"book","color":"sage","minutes":3,"tags":["Wissen","Übergabe","Team","Ordner","Organisation","Know-how"],"sections":[{"title":"Die nächsten Menschen mitdenken","text":"Was hättet ihr zu Beginn gerne gewusst? Haltet die wichtigsten Abläufe, Ansprechpartnerrollen und Materialorte verständlich fest."},{"title":"Weniger, aber gut sortiert","text":"Trennt aktuelle Unterlagen von alten Entwürfen. Eine kurze Übersicht hilft mehr als viele unkommentierte Dateien.","checklist":["Die wichtigsten Abläufe kurz beschrieben","Aktuelle Unterlagen von alten Versionen getrennt","Offene Aufgaben gekennzeichnet","Persönliche Daten und Zugriffsrechte mit dem Träger geprüft"]},{"title":"Eine gemeinsame Übergabe planen","text":"Geht die Sammlung mit den Nachfolger*innen durch. Wo Fragen entstehen, könnt ihr die Erklärung direkt verbessern.","tip":"Notiert zu jeder Sammlung, wer sie zuletzt geprüft hat und wann eine Aktualisierung sinnvoll ist."}],"related":["teamaufgaben","ehrenamt-start"]},{"id":"demo-entscheidungsweg","status":"example","title":"Findet euren nächsten Planungsschritt","summary":"Ein kurzer Entscheidungsweg und eine Sortier-Challenge helfen, die nächsten Schritte zu ordnen.","intro":"Manchmal braucht es keine längere Aufgabenliste, sondern eine klare Reihenfolge. Probiere aus, welcher Schritt zu einer Beispielsituation passt.","category":"werkstatt","icon":"compass","color":"sand","minutes":4,"tags":["Demo","Entscheidungsweg","Mini Challenge","Reihenfolge","Planung"],"hubi":{"intro":"Wir finden zusammen den nächsten Schritt.","pet":["Auch ein großer Plan beginnt mit einem kleinen Schritt.","Für Denkpausen bin ich immer zu haben."]},"sections":[{"id":"orientierung","title":"Wo steht ihr gerade?","blocks":[{"id":"planungspfad","type":"decision","title":"Was hilft eurem Team jetzt?","prompt":"Zwei kurze Fragen führen zu einem Vorschlag. Du kannst jederzeit einen Schritt zurückgehen.","start":"rahmen","nodes":[{"id":"rahmen","question":"Sind Termin und Raum bereits bestätigt?","options":[{"id":"ja","label":"Ja, beides steht.","next":"team"},{"id":"noch-nicht","label":"Da ist noch etwas offen.","next":"klaeren"}]},{"id":"team","question":"Kennt ihr Arbeitsbereiche und benötigte Besetzungen?","options":[{"id":"steht","label":"Ja, wir können das Team einteilen.","next":"einteilen"},{"id":"sammeln","label":"Das müssen wir noch zusammenstellen.","next":"aufgaben"}]},{"id":"klaeren","title":"Zuerst den Rahmen bestätigen","result":"Kläre mit Raumverantwortlichen und Team, welche Termine möglich sind. Eine bestätigte Grundlage erleichtert alle weiteren Absprachen."},{"id":"aufgaben","title":"Arbeitsbereiche gemeinsam sammeln","result":"Geht eure Veranstaltung einmal vom Aufbau bis zum Abbau durch. Notiert für jeden Bereich, wann und wie viele Personen gebraucht werden.","action":{"label":"Aufgabenverteilung nachlesen","href":"#/wiki/teamaufgaben"}},{"id":"einteilen","title":"Jetzt die Verfügbarkeiten einplanen","result":"Mit Bereichen, Besetzungsbedarf und Verfügbarkeiten könnt ihr die Schichtverteilung vorbereiten. Prüft den fertigen Plan anschließend gemeinsam.","action":{"label":"Schichtplaner öffnen","href":"#/schichtplan"}}],"hubi":{"start":"Wo steht ihr gerade? Jede Antwort ist ein guter Ausgangspunkt.","change":"Eine Frage weniger, ein bisschen mehr Klarheit.","complete":"Ein nächster Schritt statt einer langen Liste. Wuff!"}}]},{"id":"reihenfolge","title":"Eine kleine Generalprobe","text":"Für dieses Beispiel gilt: Erst Aufgaben sammeln, dann Verfügbarkeiten abfragen, anschließend einteilen und am Ende bestätigen lassen.","blocks":[{"id":"schritte-sortieren","type":"challenge","title":"Was kommt zuerst?","prompt":"Sortiere die vier Karten in die beschriebene Reihenfolge. Es gibt keinen Countdown – nimm dir die Zeit, die du brauchst.","items":[{"id":"bestaetigen","label":"Fertigen Plan vom Team bestätigen lassen"},{"id":"sammeln","label":"Arbeitsbereiche und Besetzungsbedarf sammeln"},{"id":"verteilen","label":"Schichten unter Berücksichtigung der Verfügbarkeiten verteilen"},{"id":"abfragen","label":"Verfügbarkeiten des Teams abfragen"}],"solution":["sammeln","abfragen","verteilen","bestaetigen"],"success":"Die Reihenfolge passt zu diesem Beispiel. Die bestätigten Aufgaben und Verfügbarkeiten bilden die Grundlage für den Plan; die Rückmeldung des Teams schließt die Runde.","retry":"Schau noch einmal auf die Abhängigkeiten: Was musst du wissen, bevor du die Schichten verteilst? Die Bestätigung gehört an das Ende.","hubi":{"start":"Vier Schritte, ein gemeinsamer Plan. Sortier sie mit den Pfeilen.","retry":"Fast ein Plan. Schau noch einmal, was vor der Einteilung gebraucht wird.","complete":"Alles an seinem Platz. So bleibt mehr Zeit fürs eigentliche Fest!"}}]}],"related":["demo-eventteam","demo-perspektiven"]},{"id":"demo-eventteam","status":"example","title":"Ein Abend, viele Entscheidungen","summary":"Eine kleine Generalprobe fürs Team: Entscheidungen treffen und Stolperstellen im Ablauf entdecken.","intro":"Die Türen öffnen gleich, das Team ist da. Was hilft jetzt weiter? Probiere zwei Situationen aus einem erfundenen Konzertabend aus – ganz ohne Zeitdruck.","category":"werkstatt","icon":"calendar","color":"sage","minutes":4,"tags":["Demo","Was würdest du tun","Fehlerdetektiv","Konzert","Planung"],"hubi":{"intro":"Heute bin ich bei eurem Konzertteam. Schau mit mir hinter die Kulissen!","pet":["Ich übernehme die gute Laune beim Aufbau.","Meine Lieblingsschicht? Die Denkpause mit dir."],"checklistComplete":"Team bereit? Dann kann der Abend kommen."},"sections":[{"id":"zusage","title":"Eine Aufgabe braucht eine Zusage","text":"Im Gruppenchat lesen viele mit. Damit daraus ein Plan wird, braucht es manchmal eine kurze, konkrete Rückfrage.","blocks":[{"id":"wer-holt-getraenke","type":"scenario","title":"Die Getränke stehen noch beim Händler","prompt":"Im Chat steht seit gestern: „Könnte jemand die Getränke holen?“ Der Aufbau beginnt in zwei Stunden. Was würdest du als Nächstes tun?","options":[{"id":"nachfragen","label":"Eine konkrete Person anfragen und Abholzeit sowie Fahrzeug klären.","result":"success","feedback":"Eine bestätigte Zuständigkeit macht den nächsten Schritt verlässlich. Klärt dabei auch, ob die Person Zeit und ein passendes Fahrzeug hat."},{"id":"erinnern","label":"Die Nachricht noch einmal an alle schicken.","result":"reflect","feedback":"Eine Erinnerung kann helfen. Solange niemand zusagt, bleibt die Aufgabe aber offen. Ergänze eine klare Rückfrage nach einer bestätigten Übernahme."},{"id":"selber","label":"Sofort selbst losfahren.","result":"reflect","feedback":"Das kann die Situation lösen. Prüfe vorher, ob dadurch deine eigene Aufgabe beim Aufbau liegen bleibt, und informiere das Team über die Übernahme."}],"hubi":{"start":"Ich sehe eine Aufgabe, aber noch keine feste Zusage.","success":"Eine Zusage, eine Zeit, ein Fahrzeug – jetzt wird daraus ein Plan!","retry":"Schau in die Rückmeldung. Vielleicht fehlt nur noch eine klare Absprache."}}]},{"id":"ablauf","title":"Ein zweiter Blick auf den Abend","text":"Dieser Ablauf enthält zwei Stellen, an denen ihr vorab etwas klären solltet. Tippe die Karten an und entdecke die Erklärung.","blocks":[{"id":"ablauf-pruefen","type":"detective","title":"Wo braucht der Ablauf noch eine Absprache?","items":[{"id":"aufbau","label":"17:00 · Aufbau mit dem Technikteam","issue":false,"feedback":"Für dieses Beispiel ist der Technikaufbau rechtzeitig angesetzt. Ob zwei Stunden reichen, hängt von eurem tatsächlichen Aufbau ab."},{"id":"briefing","label":"19:00 · Helferbriefing für alle, gleichzeitig öffnet der Einlass","issue":true,"feedback":"Wenn alle im Briefing sind, fehlt das Einlassteam an der Tür. Plant das Briefing früher oder in passenden Gruppen."},{"id":"soundcheck","label":"19:30 · Soundcheck im Publikumsbereich, Einlass seit 19:00","issue":true,"feedback":"Der Soundcheck liegt nach dem Einlass. Klärt mit der Technik, wie ihr ihn vor Öffnung abschließen oder vom Publikum trennen könnt."},{"id":"konzert","label":"20:00 · Konzertbeginn, Team an den vereinbarten Positionen","issue":false,"feedback":"Hier ist für dieses Beispiel keine weitere Stolperstelle versteckt. Die vereinbarten Positionen müssen natürlich vorher bekannt sein."}],"success":"Beide Stolperstellen entdeckt. Jetzt könnt ihr Einlass, Briefing und Technik gemeinsam abstimmen.","hubi":{"start":"Meine Nase sagt: Zwei Zeiten verdienen einen zweiten Blick.","success":"Gesehen! Diese Absprache spart später Hektik.","retry":"Diese Stelle ist im Beispiel schon abgestimmt. Schau noch auf die anderen Karten.","complete":"Zwei Stolperstellen gefunden. Genau dafür lohnt sich die Generalprobe!"}}],"action":{"label":"Euer Team im Schichtplaner einteilen","href":"#/schichtplan"}}],"related":["demo-perspektiven","demo-entscheidungsweg","teamaufgaben"]},{"id":"demo-perspektiven","status":"example","title":"Eine Nachricht, mehrere Blickwinkel","summary":"Wechsle zwischen zwei Formulierungen und entdecke, was Team, Gäste und Eltern jeweils wissen möchten.","intro":"Gute Kommunikation entsteht oft durch kleine Ergänzungen. Schau dir eine Nachricht aus unterschiedlichen Blickwinkeln an.","category":"werkstatt","icon":"message","color":"lavender","minutes":3,"tags":["Demo","Vorher Nachher","Perspektivenwechsel","Kommunikation"],"hubi":{"intro":"Heute wechseln wir den Blickwinkel. Ich komme mit.","pet":["Eine kleine Ergänzung kann viele Rückfragen sparen.","Ich höre gern beiden Seiten zu."]},"sections":[{"id":"vergleich","title":"Eine Absprache wird konkreter","blocks":[{"id":"nachricht-vergleichen","type":"comparison","title":"Wie würdest du die Nachricht ergänzen?","prompt":"Wechsle zwischen der Ausgangslage und einer möglichen Präzisierung.","variants":[{"label":"Ausgangslage","text":"Wir treffen uns am Samstag zum Aufbau. Bringt bitte etwas Zeit mit.","note":"Ein gemeinsamer Auftakt ist angekündigt. Uhrzeit, Treffpunkt und Dauer sind noch offen."},{"label":"Konkretisiert","text":"Wir treffen uns am Samstag um 15 Uhr am Seiteneingang des Pfarrsaals. Der Aufbau dauert voraussichtlich bis 17 Uhr. Bitte antwortet bis Donnerstag, ob ihr dabei seid.","note":"Zeit, Ort, erwartete Dauer und die gewünschte Rückmeldung sind jetzt benannt."}],"hubi":{"change":"Welche Information würde dir selbst beim Planen helfen?"}}]},{"id":"blickwinkel","title":"Was braucht die andere Person?","blocks":[{"id":"personen-verstehen","type":"perspectives","title":"Die gleiche Veranstaltung, andere Fragen","perspectives":[{"label":"Leitung","text":"Sind alle Aufgaben verteilt und haben wir eine bestätigte Zusage für jede wichtige Position?","note":"Hilfreich: Zuständigkeiten, Rückmeldefrist und eine gemeinsame Übersicht."},{"label":"Helferteam","text":"Wann bin ich dran, wo melde ich mich und wen kann ich bei Fragen ansprechen?","note":"Hilfreich: eigene Schicht, Treffpunkt und konkrete Ansprechperson."},{"label":"Gäste","text":"Wann beginnt es, wie komme ich hin und brauche ich vorher eine Anmeldung?","note":"Hilfreich: Beginn, Ort, Anreise und ein klarer nächster Schritt."},{"label":"Eltern","text":"Wann und wo kann ich mein Kind bringen und wieder abholen? Wer ist erreichbar?","note":"Hilfreich: Übergabeort, Zeiten und Kontakt der verantwortlichen Leitung."}],"hubi":{"change":"Ein Blickwechsel, eine neue Frage. Was ergänzt ihr in eurer Nachricht?"}}]},{"id":"nachrichtencheck","title":"Euer kurzer Nachrichtencheck","checklist":[{"id":"zeit","text":"Zeit und Treffpunkt genannt"},{"id":"kontakt","text":"Ansprechperson benannt"},{"id":"antwort","text":"Klar gesagt, welche Rückmeldung wir brauchen"}],"tip":"Lass eine Person gegenlesen, die nicht an der Planung beteiligt war. Ihre Rückfragen zeigen oft, was noch fehlt."}],"related":["demo-eventteam","demo-entscheidungsweg"]}],"hubi":{"intro":"Ich bin Hubi. Einmal streicheln?","pet":["Das ist genau meine Art von Ehrenamt. ♡","Ein gutes Team braucht auch Streicheleinheiten.","Wuff. Schön, dass du da bist.","Noch eine kleine Denkpause? Ich bin dabei."],"checklistComplete":"Alle Punkte abgehakt. Zeit für eine kleine Pause!","start":"Lass uns das zusammen ausprobieren.","success":"Entdeckt! Die Erklärung findest du direkt bei der Aufgabe.","retry":"Ein weiterer Blick lohnt sich. Du kannst es noch einmal versuchen.","complete":"Geschafft. Was nimmst du davon in eure Planung mit?","change":"Ein anderer Blick kann neue Fragen aufmachen.","pages":{"wiki":"Hier gibt es Wissen zum Lesen und kleine Dinge zum Ausprobieren.","schichtplan":"Du planst die Schichten, ich übernehme die Denkpausen.","antraege":"Ein Schritt nach dem anderen. Die verbindlichen Infos stehen beim Anbieter.","fortbildungen":"Was möchtest du als Nächstes lernen?","merkliste":"Deine Fundstücke warten schon auf dich."}},"courses":[{"id":"kjg-kurswoche","title":"Kurswoche: Gruppen leiten lernen","provider":"KjG München und Freising","topic":"leitung","durat (function(root,factory){

  'use strict';

  function transition(b,previous,action,value){
    const s=JSON.parse(JSON.stringify(previous||initial(b))); s.event='';
    if(action==='reset')return initial(b);
    if(action==='start'){s.started=true;s.event='start';return s;}
    if(['scenario','detective','decision','challenge'].includes(b.type)&&!s.started)return s;
    if(b.type==='scenario'&&action==='choose'){
      const option=b.options.find(x=>x.id===value); if(!option)return s;
      s.selected=[value];s.feedback=option.feedback;s.done=option.result==='success';s.tone=s.done?'success':'reflect';s.event=s.done?'success':'retry';
    }
    if(b.type==='detective'&&action==='inspect'){
      const item=b.items.find(x=>x.id===value);if(!item)return s;
      if(item.issue&&!s.selected.includes(value))s.selected.push(value);
      s.feedback=item.feedback;s.tone=item.issue?'success':'reflect';
      s.done=b.items.filter(x=>x.issue).every(x=>s.selected.includes(x.id));
      s.event=s.done?'complete':item.issue?'success':'retry';
    }
    if(['comparison','perspectives'].includes(b.type)&&action==='switch'){
      const choices=b.type==='comparison'?b.variants:b.perspectives;
      const n=Number(value);if(!Number.isInteger(n)||n<0||n>=choices.length)return s;
      s.choice=n;s.event='change';
    }
    if(b.type==='decision'){
      if(action==='back'&&s.history.length){s.node=s.history.pop();s.done=false;s.event='change';}
      if(action==='answer'){
        const node=b.nodes.find(x=>x.id===s.node);
        const option=(node?.options||[]).find(x=>x.id===value);
        if(!option||!b.nodes.some(x=>x.id===option.next))return s;
        s.history.push(s.node);s.node=option.next;
        s.done=Boolean(b.nodes.find(x=>x.id===s.node).result);s.event=s.done?'complete':'change';
      }
    }
    if(b.type==='challenge'){
      if(action==='up'||action==='down'){
        const from=s.order.indexOf(value),to=from+(action==='up'?-1:1);
        if(from<0||to<0||to>=s.order.length)return s;
        [s.order[from],s.order[to]]=[s.order[to],s.order[from]];s.feedback='';s.tone='';s.done=false;
      }
      if(action==='check'){
        s.done=s.order.every((id,i)=>b.solution[i]===id);
        s.feedback=s.done?b.success:b.retry;s.tone=s.done?'success':'reflect';s.event=s.done?'complete':'retry';
      }
    }
    return s;
  }
  function message(article,block,event,defaults){
    return block?.hubi?.[event]||article?.hubi?.[event]||defaults?.[event]||'';
  }

/* One delegated handler for all article activities. State lasts for this tab only. */
(function(root){
  'use strict';
  const {Data:D,WikiBlocks:M,WikiBlockView:V}=root.EH;
  function create({react}){
    const states=Object.create(null),entries=new Map();
    for(const a of D.articles)for(const [si,s] of a.sections.entries())for(const b of s.blocks||[])entries.set(V.key(a,s.id||String(si),b),{article:a,sectionId:s.id||String(si),block:b});
    function handleClick(event){
      const target=event.target instanceof Element?event.target:null;
      const button=target?.closest('[data-wb-action]');if(!button)return false;
      const container=button.closest('[data-wb-key]');if(!container)return false;
      const entry=entries.get(container.dataset.wbKey);if(!entry)return false;
      event.preventDefault();
      const k=container.dataset.wbKey,action=button.dataset.wbAction,value=button.dataset.wbValue;
      const before=states[k]||M.initial(entry.block);
      const after=M.transition(entry.block,before,action,value);states[k]=after;
      const shell=document.createElement('div');shell.innerHTML=V.render(entry.article,entry.sectionId,entry.block,after);
      const fresh=shell.firstElementChild;container.replaceWith(fresh);
      const candidates=[...fresh.querySelectorAll('[data-wb-action]')];
      const same=candidates.find(x=>x.dataset.wbAction===action&&x.dataset.wbValue===value&&!x.disabled);
      const rowControl=candidates.find(x=>['up','down'].includes(x.dataset.wbAction)&&x.dataset.wbValue===value&&!x.disabled);
      const focus=['up','down','switch','inspect'].includes(action)?same||rowControl:(fresh.querySelector('[data-wb-focus]')||same||candidates[0]);
      if(focus)focus.focus({preventScroll:true});
      const announcement=fresh.querySelector('.wb-announcement');
      if(announcement)announcement.textContent=after.feedback||(action==='up'||action==='down'?`Neue Position: ${after.order.indexOf(value)+1}`:action==='switch'?fresh.querySelector('.wb-panel')?.textContent||'':'');
      if(after.event){
        const celebrate=!before.done&&after.done&&entry.block.celebrate!==false&&entry.article.category!=='schutz';
        react(M.message(entry.article,entry.block,after.event,D.hubi),celebrate,fresh,entry.article.hubi?.enabled!==false);
      }
      return true;
    }
    function reset(){for(const k of Object.keys(states))delete states[k];}
    return {states,handleClick,reset};
  }
  root.EH.WikiBlockController={create};
})(globalThis);

(function (root) {

      areas: [], shifts: [], people: [], rules: { fairness: 'minutes', preferBreaks: true }, assignments: {}, locks: {} };
  }
  const orderedShifts = p => [...p.shifts].sort((a, b) => a.start.localeCompare(b.start) || p.areas.findIndex(x => x.id === a.areaId) - p.areas.findIndex(x => x.id === b.areaId));
  const eligible = (p, person, shift) => person.areaIds.includes(shift.areaId) && !person.unavailable.some(range => overlap(range, shift));

    if (Math.ceil((to - from) / minutes) > LIMITS.shifts) throw new Error('Zu viele Schichten. Bitte den Zeitraum oder die Schichtlänge anpassen.');
    const shifts = [];

    if (p.areas.some(a => a.name.toLocaleLowerCase('de') === name.toLocaleLowerCase('de'))) throw new Error('Diesen Arbeitsbereich gibt es bereits.');
    if (minute(start) < minute(p.event.start) || minute(end) > minute(p.event.end)) throw new Error('Die Schichten müssen innerhalb des Veranstaltungszeitraums liegen.');

(function (root, factory) {

  'use strict';

  const PREFIX = 'ehrenhub.v1.';

  function createStore(getStorage, prefix = PREFIX) {
    let available = true;

        return getStorage().getItem(prefix + key) ?? fallback;
      } catch {
        available = false;
        return fallback;
      }
    }

      try {

          ([key, value]) => validKeys.has(key) && validValue(value)

      } catch {
        return {};
      }
    }
    function write(key, value) {
      try {
        getStorage().setItem(prefix + key, JSON.stringify(value));
        return true;
      } catch {
        available = false;
        return false;
      }
    }
    function clear() {
      let cleared = true;
      for (const key of KEYS) {
        try {
          getStorage().removeItem(prefix + key);
        } catch {
          available = false;
          cleared = false;
        }
      }
      return cleared;
    }
    return { read, readObject, write, clear, get available() { return available; } };
  }

  return { createStore, PREFIX };

      const prefix=el.dataset.progressFor+':'+(el.dataset.progressSection!==undefined?el.dataset.progressSection+':':'');
      const keys=[...checkKeys].filter(key=>key.startsWith(prefix));
      el.textContent=keys.filter(key=>state.checks[key]).length+' von '+keys.length+' erledigt';
    });
  }
  function updateReadingProgress(){
    const bar=document.getElementById('reading-progress');if(!bar)return;
    const body=document.querySelector('.article-content');if(!body)return;
    const rect=body.getBoundingClientRect();const available=Math.max(1,rect.height-window.innerHeight+160);
    const progress=Math.min(100,Math.max(0,(100-rect.top)/available*100));bar.style.width=progress+'%';
  }
  function renderWizard(focus=true){
    const target=document.getElementById('wizard-container');if(!target)return;
    target.classList.remove('show-results');target.innerHTML=V.grantWizard(state);
    if(focus){const heading=document.getElementById('wizard-title');heading.focus({preventScroll:true});heading.scrollIntoView({block:'nearest',behavior:'smooth'});}
  }
  function nextWizard(){
    const q=V.grantQuestions[state.wizardStep];if(!q.options.some(option=>option[0]===state.grantAnswers[q.key]))return;
    if(state.wizardStep<2){state.wizardStep++;renderWizard();}
    else if(C.validGrantAnswers(state.grantAnswers)){
      const params=new URLSearchParams(state.grantAnswers);location.hash='/antraege?'+params.toString();
    }
  }
  function setSosTab(id,focus=false){
    if(!sosIds.includes(id))return;
    state.sosTab=id;
    document.querySelectorAll('[data-sos-tab]').forEach(el=>{const selected=el.dataset.sosTab===id;el.setAttribute('aria-selected',String(selected));el.tabIndex=selected?0:-1;el.classList.toggle('selected',selected);if(selected&&focus)el.focus();});
    const panel=document.getElementById('sos-panel');panel.innerHTML=V.sosSituation(id);panel.setAttribute('aria-labelledby','sos-tab-'+id);
  }
  function currentArticle(){return route.page==='wiki'?D.articles.find(a=>a.id===route.id):null;}
  function syncHubi(){hubi.hidden=state.hubiHidden||route.page==='sos'||currentArticle()?.hubi?.enabled===false;}
  function bubble(text,duration=3500){clearTimeout(introTimer);const el=document.getElementById('hubi-bubble');if(!el||hubi.hidden)return;clearTimeout(bubbleTimer);el.textContent=text;el.classList.add('visible');bubbleTimer=setTimeout(()=>el.classList.remove('visible'),duration);}
  function pet(){
    state.petCount++;clearTimeout(petTimer);
    hubi.classList.remove('is-petted');void hubi.offsetWidth;hubi.classList.add('is-petted');
    const article=currentArticle();
    const phrases=article?.hubi?.pet||(D.hubi.pages?.[route.page]?[D.hubi.pages[route.page],...D.hubi.pet]:D.hubi.pet);
    bubble(phrases[(state.petCount-1)%phrases.length],4000);
    petTimer=setTimeout(()=>hubi.classList.remove('is-petted'),1900);
  }
  function exportSaved(){
    const items=state.bookmarks.map(key=>index.find(x=>x.key===key)).filter(Boolean);
    const lines=['EHRENHUB – DEINE MERKLISTE','Lokaler Prototyp · Beispielinhalte','',...items.flatMap(item=>[
      item.title,item.label,item.summary,'Lokale Unterseite: '+item.href,''])];
    const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='Ehrenhub-Merkliste.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Deine Merkliste wurde als Textdatei vorbereitet.');
  }
  function react(message,celebrate=false,container=null,allowHubi=true){
    if(allowHubi&&message)bubble(message,5000);
    if(!celebrate)return;
    const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    if(allowHubi&&!hubi.hidden&&!reduced){
      clearTimeout(petTimer);hubi.classList.remove('is-petted');void hubi.offsetWidth;hubi.classList.add('is-petted');
      petTimer=setTimeout(()=>hubi.classList.remove('is-petted'),1900);
    }
    if(!container||reduced)return;
    container.classList.add('wb-celebrate');
    container.querySelector('.wb-confetti')?.remove();
    const confetti=document.createElement('div');confetti.className='wb-confetti';confetti.setAttribute('aria-hidden','true');
    for(let i=0;i<12;i++){const bit=document.createElement('span');bit.style.setProperty('--x',(8+i*7)+'%');bit.style.setProperty('--c',['#729766','#d9b66c','#a6bcb0'][i%3]);bit.style.setProperty('--d',(i%4*.045)+'s');confetti.append(bit);}
    container.append(confetti);setTimeout(()=>{confetti.remove();container.classList.remove('wb-celebrate');},1500);
  }
  function resetData(){
    const cleared=storage.clear();
    planner.reset();
    activities.reset();
    state.bookmarks=[];state.checks={};state.feedback={};state.hubiHidden=false;state.petCount=0;
    closeDialog(infoDialog);render();toast(cleared?'Deine lokalen Ehrenhub-Daten wurden zurückgesetzt.':'Ansicht zurückgesetzt. Dein Browser erlaubt gerade keinen Zugriff auf gespeicherte Daten.');
  }
  const actions={
    search:()=>openSearch(),about:()=>openInfo('about'),privacy:()=>openInfo('privacy'),
    'modal-close':()=>closeDialog(infoDialog),'search-close':()=>closeDialog(searchDialog),
    menu:()=>{const menu=document.getElementById('mobile-nav');const btn=document.querySelector('[data-action="menu"]');menu.hidden=!menu.hidden;btn.setAttribute('aria-expanded',String(!menu.hidden));btn.setAttribute('aria-label',menu.hidden?'Menü öffnen':'Menü schließen');btn.innerHTML=I(menu.hidden?'menu':'close');},
    'wiki-reset':()=>{updateQuery({q:'',category:''});document.getElementById('wiki-search').value='';updateWiki();},
    'course-reset':()=>{updateQuery({q:'',topic:'',duration:'',format:'',sort:''});document.getElementById('course-search').value='';document.querySelectorAll('[data-course-filter]').forEach(el=>el.value=el.dataset.courseFilter==='sort'?'datum':'alle');updateCourses();},
    'wizard-next':nextWizard,
    'wizard-back':()=>{if(state.wizardStep>0){state.wizardStep--;renderWizard();}},
    'wizard-reset':()=>{state.grantAnswers={region:route.query.get('region')||'',project:route.query.get('project')||'',stage:route.query.get('stage')||''};state.wizardStep=0;updateQuery({region:'',project:'',stage:''});renderWizard();},
    print:()=>window.print(),
    'export-saved':exportSaved,'clear-saved':()=>openInfo('clear-saved'),
    'confirm-clear':()=>{state.bookmarks=[];const stored=persist('bookmarks',[]);closeDialog(infoDialog);render();if(stored)toast('Deine Merkliste ist wieder leer.');},
    'reset-data':()=>openInfo('reset-confirm'),'confirm-reset':resetData,
    'hubi-hide':()=>{state.hubiHidden=true;const stored=persist('hubiHidden',true);syncHubi();if(stored)toast('Hubi macht Pause. Unten im Footer kannst du ihn wieder wecken.');},
    'hubi-show':()=>{state.hubiHidden=false;persist('hubiHidden',false);syncHubi();if(route.page==='sos')toast('Hubi wartet auf den anderen Seiten.');else bubble('Wieder da! Und immer für dich im Team.',4000);},
    pet,
    'quick-exit':()=>{state.sosTab='sorge';location.replace('#/');}
  };
  const planner=globalThis.EH.ShiftController.create({storage,toast});
  const activities=globalThis.EH.WikiBlockController.create({react});
  state.activities=activities;
  state.planner=planner;
  document.addEventListener('click',event=>{
    if(planner.handleClick(event))return;
    if(activities.handleClick(event))return;
    const target=event.target instanceof Element?event.target:null;if(!target)return;
    if(target.closest('.skip-link')){event.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({block:'start',behavior:'smooth'});return;}
    const bookmarkButton=target.closest('[data-bookmark]');if(bookmarkButton){event.preventDefault();toggleBookmark(bookmarkButton.dataset.bookmark);return;}
    const action=target.closest('[data-action]');if(action){const fn=actions[action.dataset.action];if(fn){event.preventDefault();fn();}return;}
    const wiki=target.closest('[data-wiki-category]');if(wiki){updateQuery({category:wiki.dataset.wikiCategory});updateWiki();return;}
    const topic=target.closest('[data-course-topic]');if(topic){updateQuery({topic:topic.dataset.courseTopic});updateCourses();return;}
    const kind=target.closest('[data-search-kind]');if(kind){updateQuery({kind:kind.dataset.searchKind});updateSearchPage();return;}
    const section=target.closest('[data-scroll-section]');if(section){const el=document.getElementById(section.dataset.scrollSection);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});const heading=el.querySelector('h2');heading.tabIndex=-1;heading.focus({preventScroll:true});}return;}
    const feedback=target.closest('[data-feedback]');if(feedback){const id=feedback.dataset.article;state.feedback[id]=feedback.dataset.feedback;const stored=persist('feedback',state.feedback);document.querySelectorAll('[data-feedback]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.article===id&&el.dataset.feedback===state.feedback[id])));if(stored)toast('Danke! Dein Feedback ist für diese Demo nur auf diesem Gerät gespeichert.');return;}
    const tab=target.closest('[data-sos-tab]');if(tab){setSosTab(tab.dataset.sosTab);return;}
    const link=target.closest('a[href^="#/"]');if(link){closeDialog(searchDialog);closeDialog(infoDialog);const mobile=document.getElementById('mobile-nav');if(mobile)mobile.hidden=true;if(route.page==='sos')state.sosTab='sorge';}
  });
  document.addEventListener('submit',event=>{
    if(planner.handleSubmit(event))return;
    const form=event.target;
    if(form.matches('[data-form="hero-search"]')){event.preventDefault();const q=new FormData(form).get('q').trim();if(q)location.hash='/suche?q='+encodeURIComponent(q);}
    else if(form.id==='quick-search-form'){event.preventDefault();const q=searchInput.value.trim();closeDialog(searchDialog);location.hash='/suche'+(q?'?q='+encodeURIComponent(q):'');}
  });
  document.addEventListener('input',event=>{
    if(planner.handleInput(event))return;
    const el=event.target;
    if(el===searchInput){updateQuickSearch();return;}
    if(el.dataset.search==='wiki'){updateQuery({q:el.value});updateWiki();}
    if(el.dataset.search==='course'){updateQuery({q:el.value});updateCourses();}
    if(el.dataset.search==='global'){updateQuery({q:el.value});updateSearchPage();}
  });
  document.addEventListener('change',event=>{
    if(planner.handleChange(event))return;
    const el=event.target;
    if(el.dataset.check&&checkKeys.has(el.dataset.check)){
      if(el.checked)state.checks[el.dataset.check]=true;else delete state.checks[el.dataset.check];persist('checks',state.checks);el.closest('.checklist-item').classList.toggle('done',el.checked);updateChecklistProgress();
      const article=currentArticle(),prefix=el.dataset.check.slice(0,el.dataset.check.lastIndexOf(':')+1);
      const complete=el.checked&&[...checkKeys].filter(k=>k.startsWith(prefix)).every(k=>state.checks[k]);
      if(complete&&article)react(article.hubi?.checklistComplete||D.hubi.checklistComplete,article.category!=='schutz',null,article.hubi?.enabled!==false);
    }
    if(el.dataset.grantAnswer){const question=V.grantQuestions[state.wizardStep];if(el.dataset.grantAnswer===question.key&&question.options.some(o=>o[0]===el.value)){state.grantAnswers[question.key]=el.value;document.querySelectorAll('.wizard-option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));document.getElementById('wizard-next').disabled=false;}}
    if(el.dataset.courseFilter){updateQuery({[el.dataset.courseFilter]:el.value});updateCourses();if(el.dataset.courseFilter==='sort')document.getElementById('course-sort').focus();}
  });
  document.addEventListener('keydown',event=>{
    const target=event.target;const editing=target instanceof Element&&(target.matches('input,textarea,select')||target.isContentEditable);
    if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(searchDialog.open)closeDialog(searchDialog);else openSearch();return;}
    if(event.key==='/'&&!editing&&!infoDialog.open&&!searchDialog.open){event.preventDefault();openSearch();return;}
    if(searchDialog.open){
      const links=[...searchBody.querySelectorAll('[data-search-result]')];
      if(event.key==='ArrowDown'||event.key==='ArrowUp'){
        if(!links.length)return;event.preventDefault();const i=links.indexOf(document.activeElement);
        if(event.key==='ArrowDown')links[(i+1)%links.length].focus();else if(i<=0)searchInput.focus();else links[i-1].focus();
      }
    }
    if(target instanceof Element&&target.matches('[data-sos-tab]')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)){
      event.preventDefault();const at=sosIds.indexOf(state.sosTab);const next=event.key==='Home'?0:event.key==='End'?sosIds.length-1:(at+(['ArrowRight','ArrowDown'].includes(event.key)?1:sosIds.length-1))%sosIds.length;setSosTab(sosIds[next],true);
    }
    if(event.key==='Escape'){const menu=document.getElementById('mobile-nav');if(menu&&!menu.hidden){menu.hidden=true;const btn=document.querySelector('[data-action="menu"]');btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Menü öffnen');btn.innerHTML=I('menu');btn.focus();}}
  });
  [searchDialog,infoDialog].forEach(dialog=>{
    // Only a pointer released outside the dialog box closes the backdrop.
    dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});
  });
  window.addEventListener('hashchange',render);
  window.addEventListener('scroll',()=>{if(!scrollFrame)scrollFrame=requestAnimationFrame(()=>{updateReadingProgress();scrollFrame=null;});},{passive:true});
  window.addEventListener('storage',event=>{
    if(event.key===PREFIX+'bookmarks'){state.bookmarks=C.readBookmarks(event.newValue,index);if(route.page==='merkliste')main.innerHTML=V.main(route,state,index);updateBookmarkButtons();}
  });
  render();
  if(!currentArticle()?.hubi?.intro)introTimer=setTimeout(()=>{if(!state.hubiHidden&&route.page!=='sos')bubble(D.hubi.pages?.[route.page]||D.hubi.intro,5000);},1400);
  if(!storage.available)setTimeout(()=>toast('Lokale Speicherung ist in diesem Browser nicht verfügbar. Du kannst trotzdem alles ausprobieren.'),800);
})();
</script>
